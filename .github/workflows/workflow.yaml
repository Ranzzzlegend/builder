name: Build Flutter APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.2'
          channel: 'stable'

      - name: Extract ZIP
        run: |
          unzip -o flutter-project.zip -d extracted
          echo "=== Struktur Folder hasil ekstraksi ==="
          find extracted -maxdepth 2 -type f | head -50
          echo "=== Cek pubspec.yaml ==="
          find extracted -name "pubspec.yaml"

      - name: Create New Flutter Project & Copy Files
        run: |
          # Buat project baru yang valid
          flutter create -t app new_app

          # Cari pubspec.yaml dari hasil ekstraksi
          PUBSPEC_PATH=$(find extracted -name "pubspec.yaml" | head -n 1)
          if [ -z "$PUBSPEC_PATH" ]; then
            echo "Error: pubspec.yaml tidak ditemukan"
            exit 1
          fi

          # Ambil folder sumber (folder tempat pubspec.yaml berada)
          SRC_DIR=$(dirname "$PUBSPEC_PATH")
          echo "Source directory: $SRC_DIR"

          # Salin lib/ jika ada
          if [ -d "$SRC_DIR/lib" ]; then
            rm -rf new_app/lib
            cp -r "$SRC_DIR/lib" new_app/lib
          else
            echo "Error: folder lib tidak ditemukan"
            exit 1
          fi

          # Salin pubspec.yaml
          cp "$PUBSPEC_PATH" new_app/pubspec.yaml

          # Salin aset lain jika ada (assets, dll)
          if [ -d "$SRC_DIR/assets" ]; then
            cp -r "$SRC_DIR/assets" new_app/assets
          fi

          # Pindah ke project baru
          cd new_app

      - name: Install Dependencies
        run: |
          cd new_app
          flutter pub get

      - name: Build APK
        run: |
          cd new_app
          flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: new_app/build/app/outputs/flutter-apk/app-release.apk
