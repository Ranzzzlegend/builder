name: Build Flutter APK
on:
  push:
    branches:
      - 'build-*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.2'
          channel: 'stable'

      - name: Extract & Cari pubspec.yaml
        run: |
          unzip -o flutter-project.zip -d extracted
          PUBSPEC=$(find extracted -name "pubspec.yaml" | head -n 1)
          if [ -z "$PUBSPEC" ]; then
            echo "❌ pubspec.yaml tidak ditemukan"
            find extracted -type f | head -20
            exit 1
          fi

      - name: Buat Project Baru & Salin Kode
        run: |
          flutter create -t app new_app
          SRC_DIR=$(dirname $(find extracted -name "pubspec.yaml" | head -n 1))
          echo "Source directory: $SRC_DIR"

          # Salin kode utama
          if [ -d "$SRC_DIR/lib" ]; then
            rm -rf new_app/lib
            cp -r "$SRC_DIR/lib" new_app/lib
          else
            echo "❌ folder lib tidak ditemukan"
            exit 1
          fi

          # Salin pubspec.yaml
          cp "$SRC_DIR/pubspec.yaml" new_app/pubspec.yaml

          # Hapus assets yang rusak dan buat folder baru
          rm -rf new_app/assets
          mkdir -p new_app/assets

          # Salin assets jika ada
          if [ -d "$SRC_DIR/assets" ]; then
            cp -r "$SRC_DIR/assets"/* new_app/assets/ 2>/dev/null || true
          fi

          # Buat file placeholder agar folder assets tidak kosong
          echo "test" > new_app/assets/.gitkeep

      - name: Install Dependencies
        run: cd new_app && flutter pub get

      - name: Build APK
        run: |
          cd new_app
          flutter clean
          flutter pub get
          flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: new_app/build/app/outputs/flutter-apk/app-release.apk
