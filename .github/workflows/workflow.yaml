name: Build Flutter APK
on:
  push:
    branches:
      - 'build-*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.2'
          channel: 'stable'

      - name: Extract & Cari pubspec.yaml
        run: |
          unzip -o flutter-project.zip -d extracted
          PUBSPEC=$(find extracted -name "pubspec.yaml" | head -n 1)
          if [ -z "$PUBSPEC" ]; then
            echo "❌ pubspec.yaml tidak ditemukan"
            find extracted -type f | head -20
            exit 1
          fi

      - name: Buat Project Baru & Salin Kode
        run: |
          # 1. Buat project baru yang valid
          flutter create -t app new_app

          # 2. Cari folder sumber dari ZIP
          SRC_DIR=$(dirname $(find extracted -name "pubspec.yaml" | head -n 1))
          echo "Source directory: $SRC_DIR"

          # 3. Salin kode utama (lib/)
          if [ -d "$SRC_DIR/lib" ]; then
            rm -rf new_app/lib
            cp -r "$SRC_DIR/lib" new_app/lib
          else
            echo "❌ folder lib tidak ditemukan"
            exit 1
          fi

          # 4. Salin pubspec.yaml
          cp "$SRC_DIR/pubspec.yaml" new_app/pubspec.yaml

          # 5. HAPUS folder assets yang rusak dan buat yang baru
          rm -rf new_app/assets
          mkdir -p new_app/assets
          
          # Salin assets hanya jika ada dan valid
          if [ -d "$SRC_DIR/assets" ]; then
            cp -r "$SRC_DIR/assets"/* new_app/assets/ 2>/dev/null || true
          fi

          # 6. PERBAIKI pubspec.yaml: Hapus referensi asset yang tidak valid
          cat > fix_assets.py << 'EOF'
import re

# Baca pubspec.yaml
with open('new_app/pubspec.yaml', 'r') as f:
    content = f.read()

# Hapus bagian assets: yang mungkin rusak
# Cari pola assets: dan hapus sampai indentasi berikutnya
content = re.sub(r'assets:\s*\n(?:\s+-\s+.*\n?)*', 'assets:\n  - assets/\n', content)

# Tulis kembali
with open('new_app/pubspec.yaml', 'w') as f:
    f.write(content)
EOF
          python3 fix_assets.py

          # Pastikan folder assets ada
          mkdir -p new_app/assets
          echo "test" > new_app/assets/.gitkeep

      - name: Install Dependencies
        run: cd new_app && flutter pub get

      - name: Build APK
        run: |
          cd new_app
          # Bersihkan cache build jika ada masalah
          flutter clean
          flutter pub get
          flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: new_app/build/app/outputs/flutter-apk/app-release.apk
