name: Build Flutter APK

on:
  push:
    branches:
      - 'build-*'  # Berjalan pada semua branch dengan awalan "build-"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.2' # Versi Flutter dengan Dart 3.10
          channel: 'stable'

      - name: Extract & Cari pubspec.yaml
        run: |
          unzip -o flutter-project.zip -d extracted
          PUBSPEC=$(find extracted -name "pubspec.yaml" | head -n 1)
          if [ -z "$PUBSPEC" ]; then
            echo "❌ pubspec.yaml tidak ditemukan"
            find extracted -type f | head -20
            exit 1
          fi

      - name: Buat Project Baru & Salin Kode
        run: |
          # 1. Buat project baru yang valid
          flutter create -t app new_app

          # 2. Cari folder sumber
          SRC_DIR=$(dirname $(find extracted -name "pubspec.yaml" | head -n 1))
          echo "Source directory: $SRC_DIR"

          # 3. Salin lib/ (kode utama)
          if [ -d "$SRC_DIR/lib" ]; then
            rm -rf new_app/lib
            cp -r "$SRC_DIR/lib" new_app/lib
          else
            echo "❌ folder lib tidak ditemukan"
            exit 1
          fi

          # 4. Salin pubspec.yaml
          cp "$SRC_DIR/pubspec.yaml" new_app/pubspec.yaml

          # 5. Salin assets/ jika ada
          if [ -d "$SRC_DIR/assets" ]; then
            cp -r "$SRC_DIR/assets" new_app/assets
          fi

      - name: Install Dependencies
        run: cd new_app && flutter pub get

      - name: Build APK
        run: cd new_app && flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: new_app/build/app/outputs/flutter-apk/app-release.apk
