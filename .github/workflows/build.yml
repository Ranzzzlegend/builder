name: Build APK

on:
  push:
    branches: [build]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y imagemagick jq unzip curl

      - name: Read build config
        id: config
        run: |
          if [ -f build-config.json ]; then
            echo "type=$(jq -r .type build-config.json)" >> $GITHUB_ENV
            echo "url=$(jq -r .url build-config.json)" >> $GITHUB_ENV
            echo "app_name=$(jq -r .app_name build-config.json)" >> $GITHUB_ENV
            echo "build_type=$(jq -r .build_type build-config.json)" >> $GITHUB_ENV
          else
            echo "type=unknown" >> $GITHUB_ENV
          fi

      - name: Generate keystore
        run: |
          keytool -genkey -v -keystore release.keystore -alias release -keyalg RSA -keysize 2048 -validity 10000 -storepass password -keypass password -dname "CN=BuildBot, OU=Dev, O=BuildBot, L=City, S=State, C=ID"

      - name: Web2APK - Setup gradle
        if: env.type == 'web2apk'
        run: |
          mkdir -p project
          cat > project/build.gradle <<'EOF'
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.7.3' }
          }
          allprojects { repositories { google(); mavenCentral() } }
          task clean(type: Delete) { delete rootProject.buildDir }
          EOF
          cat > project/settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "MyApp"
          include ':app'
          EOF
          cat > project/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m
          android.useAndroidX=true
          android.enableJetifier=true
          EOF

      - name: Web2APK - Create app build.gradle
        if: env.type == 'web2apk'
        run: |
          mkdir -p project/app
          cat > project/app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.web2apk.app'
              compileSdk 34
              defaultConfig { applicationId "com.web2apk.app"; minSdk 21; targetSdk 34; versionCode 1; versionName "1.0" }
              signingConfigs {
                  release { storeFile file("debug.keystore"); storePassword "android"; keyAlias "androiddebugkey"; keyPassword "android" }
              }
              buildTypes { release { signingConfig signingConfigs.release; minifyEnabled false } }
              compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
          }
          dependencies {
              implementation 'androidx.core:core-ktx:1.9.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.8.0'
              implementation 'androidx.webkit:webkit:1.4.0'
          }
          EOF

      - name: Web2APK - Create Java sources
        if: env.type == 'web2apk'
        run: |
          mkdir -p project/app/src/main/java/com/web2apk/app
          cat > project/app/src/main/java/com/web2apk/app/MainActivity.java <<'EOF'
          package com.web2apk.app;
          import android.annotation.SuppressLint;
          import android.app.DownloadManager;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import android.os.Environment;
          import android.view.View;
          import android.webkit.*;
          import android.widget.ProgressBar;
          import androidx.appcompat.app.AppCompatActivity;
          import androidx.appcompat.widget.Toolbar;
          import androidx.swiperefreshlayout.widget.SwipeRefreshLayout;
          public class MainActivity extends AppCompatActivity {
              private static final String WEBSITE_URL = "__URL__";
              private WebView webView;
              private ProgressBar progressBar;
              private SwipeRefreshLayout swipeRefreshLayout;
              @SuppressLint("SetJavaScriptEnabled")
              @Override protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);
                  webView = findViewById(R.id.webView);
                  progressBar = findViewById(R.id.progressBar);
                  swipeRefreshLayout = findViewById(R.id.swipeRefreshLayout);
                  Toolbar toolbar = findViewById(R.id.toolbar);
                  setSupportActionBar(toolbar);
                  setupWebView();
                  swipeRefreshLayout.setOnRefreshListener(() -> webView.reload());
                  webView.loadUrl(WEBSITE_URL);
              }
              @SuppressLint("SetJavaScriptEnabled")
              private void setupWebView() {
                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setMediaPlaybackRequiresUserGesture(false);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);
                  settings.setUseWideViewPort(true);
                  settings.setLoadWithOverviewMode(true);
                  settings.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);
                  webView.setWebViewClient(new WebViewClient() {
                      @Override public void onPageFinished(WebView view, String url) { progressBar.setVisibility(View.GONE); swipeRefreshLayout.setRefreshing(false); }
                  });
                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override public void onProgressChanged(WebView view, int progress) { progressBar.setProgress(progress); progressBar.setVisibility(progress >= 100 ? View.GONE : View.VISIBLE); }
                  });
                  webView.setDownloadListener(new DownloadListener() {
                      @Override public void onDownloadStart(String url, String userAgent, String contentDisposition, String mimetype, long contentLength) {
                          DownloadManager.Request request = new DownloadManager.Request(Uri.parse(url));
                          request.setNotificationVisibility(DownloadManager.Request.VISIBILITY_VISIBLE_NOTIFY_COMPLETED);
                          request.setDestinationInExternalPublicDir(Environment.DIRECTORY_DOWNLOADS, contentDisposition);
                          ((DownloadManager) getSystemService(DOWNLOAD_SERVICE)).enqueue(request);
                      }
                  });
              }
              @Override public void onBackPressed() { if (webView.canGoBack()) webView.goBack(); else super.onBackPressed(); }
          }
          EOF
          cat > project/app/src/main/java/com/web2apk/app/SplashActivity.java <<'EOF'
          package com.web2apk.app;
          import android.content.Intent;
          import android.os.Bundle;
          import android.os.Handler;
          import androidx.appcompat.app.AppCompatActivity;
          public class SplashActivity extends AppCompatActivity {
              @Override protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_splash);
                  new Handler().postDelayed(() -> { startActivity(new Intent(this, MainActivity.class)); finish(); }, 1800);
              }
          }
          EOF

      - name: Web2APK - Create manifest & layouts
        if: env.type == 'web2apk'
        run: |
          mkdir -p project/app/src/main/res/layout project/app/src/main/res/values
          cat > project/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application android:allowBackup="true" android:hardwareAccelerated="true" android:usesCleartextTraffic="true" android:icon="@mipmap/ic_launcher" android:label="@string/app_name" android:theme="@style/AppTheme">
                  <activity android:name=".SplashActivity" android:exported="true" android:theme="@style/SplashTheme">
                      <intent-filter><action android:name="android.intent.action.MAIN" /><category android:name="android.intent.category.LAUNCHER" /></intent-filter>
                  </activity>
                  <activity android:name=".MainActivity" android:exported="false" />
              </application>
          </manifest>
          EOF
          cat > project/app/src/main/res/layout/activity_main.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android" android:layout_width="match_parent" android:layout_height="match_parent" android:orientation="vertical">
              <androidx.appcompat.widget.Toolbar android:id="@+id/toolbar" android:layout_width="match_parent" android:layout_height="56dp" android:background="#000000" />
              <ProgressBar android:id="@+id/progressBar" style="?android:attr/progressBarStyleHorizontal" android:layout_width="match_parent" android:layout_height="4dp" android:max="100" />
              <androidx.swiperefreshlayout.widget.SwipeRefreshLayout android:id="@+id/swipeRefreshLayout" android:layout_width="match_parent" android:layout_height="match_parent">
                  <WebView android:id="@+id/webView" android:layout_width="match_parent" android:layout_height="match_parent" />
              </androidx.swiperefreshlayout.widget.SwipeRefreshLayout>
          </LinearLayout>
          EOF
          cat > project/app/src/main/res/layout/activity_splash.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <RelativeLayout xmlns:android="http://schemas.android.com/apk/res/android" android:layout_width="match_parent" android:layout_height="match_parent" android:background="#000000">
              <LinearLayout android:layout_width="wrap_content" android:layout_height="wrap_content" android:layout_centerInParent="true" android:gravity="center" android:orientation="vertical">
                  <ImageView android:layout_width="120dp" android:layout_height="120dp" android:src="@mipmap/ic_launcher" />
                  <TextView android:id="@+id/splashAppName" android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="@string/app_name" android:textSize="26sp" android:textStyle="bold" android:textColor="#FFFFFF" android:layout_marginTop="20dp" />
                  <ProgressBar android:layout_width="40dp" android:layout_height="40dp" android:layout_marginTop="30dp" />
              </LinearLayout>
          </RelativeLayout>
          EOF
          cat > project/app/src/main/res/values/strings.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources><string name="app_name">__APP_NAME__</string></resources>
          EOF
          cat > project/app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="Theme.Material3.DayNight.NoActionBar">
                  <item name="android:statusBarColor">#000000</item>
                  <item name="android:navigationBarColor">#000000</item>
              </style>
              <style name="SplashTheme" parent="Theme.Material3.DayNight.NoActionBar">
                  <item name="android:windowBackground">@android:color/black</item>
              </style>
          </resources>
          EOF

      - name: Web2APK - Apply config safely
        if: env.type == 'web2apk'
        run: |
          # Sanitasi URL & app name menggunakan jq (tidak ada injeksi)
          URL=$(jq -r .url build-config.json)
          APP_NAME=$(jq -r .app_name build-config.json)
          # Ganti placeholder dengan nilai yang aman (dengan sed, tapi sudah disanitasi di jq)
          sed -i "s|__URL__|$URL|g" project/app/src/main/java/com/web2apk/app/MainActivity.java
          sed -i "s|__APP_NAME__|$APP_NAME|g" project/app/src/main/res/values/strings.xml
          # Icon processing
          mkdir -p project/app/src/main/res/mipmap-*
          convert build-assets/icon.png -resize 72x72 project/app/src/main/res/mipmap-hdpi/ic_launcher.png
          convert build-assets/icon.png -resize 48x48 project/app/src/main/res/mipmap-mdpi/ic_launcher.png
          convert build-assets/icon.png -resize 96x96 project/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          convert build-assets/icon.png -resize 144x144 project/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          convert build-assets/icon.png -resize 192x192 project/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          # Keystore debug
          keytool -genkey -v -keystore project/app/debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug, O=Android, C=US"

      - name: Web2APK - Build
        if: env.type == 'web2apk'
        run: |
          cd project
          source "$HOME/.sdkman/bin/sdkman-init.sh"
          gradle assembleRelease

      - name: Sign Web2APK APK
        if: env.type == 'web2apk'
        run: |
          APK=$(find project/app/build/outputs/apk/release -name "*.apk" | head -n1)
          if [ -f "$APK" ]; then
            $ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -n1)/apksigner sign --ks release.keystore --ks-pass pass:password --key-pass pass:password "$APK"
          fi

      - name: Flutter - Prepare project
        if: env.type == 'flutter'
        run: |
          rm -rf flutter-project
          mkdir -p flutter-project
          unzip -q flutter-project.zip -d flutter-project
          # Flatten folder tunggal
          FIRST_DIR=$(find flutter-project -mindepth 1 -maxdepth 1 -type d | head -n1)
          if [ -n "$FIRST_DIR" ] && [ -f "$FIRST_DIR/pubspec.yaml" ]; then
            mv "$FIRST_DIR"/* flutter-project/ 2>/dev/null || true
          fi
          test -f flutter-project/pubspec.yaml || exit 1

      - name: Detect Flutter version
        if: env.type == 'flutter'
        id: flutter_detect
        run: |
          SDK_LINE=$(grep -A2 '^environment:' flutter-project/pubspec.yaml | grep 'sdk:' | head -n1 | sed 's/.*sdk:[[:space:]]*//; s/["'\'']//g' || true)
          DART_VERSION=$(echo "$SDK_LINE" | grep -oE '[0-9]+\.[0-9]+' | head -n1)
          case "$DART_VERSION" in
            3.8*|3.9*|3.10*|3.11*|3.12*|3.13*|3.14*|3.15*) FLUTTER_VERSION="3.35.2" ;;
            3.7*) FLUTTER_VERSION="3.29.0" ;;
            3.6*) FLUTTER_VERSION="3.27.0" ;;
            3.5*) FLUTTER_VERSION="3.24.0" ;;
            3.4*) FLUTTER_VERSION="3.22.0" ;;
            3.3*) FLUTTER_VERSION="3.19.0" ;;
            3.2*) FLUTTER_VERSION="3.16.0" ;;
            3.1*) FLUTTER_VERSION="3.13.0" ;;
            3.0*) FLUTTER_VERSION="3.10.0" ;;
            *) FLUTTER_VERSION="3.27.0" ;;
          esac
          echo "FLUTTER_VERSION=$FLUTTER_VERSION" >> $GITHUB_ENV

      - name: Setup Flutter
        if: env.type == 'flutter'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: Build Flutter APK
        if: env.type == 'flutter'
        run: |
          cd flutter-project
          BUILD_MODE="${{ env.build_type }}"
          MAX_RETRIES=3
          RETRY=0
          while [ $RETRY -lt $MAX_RETRIES ]; do
            RETRY=$((RETRY+1))
            if flutter pub get && flutter build apk --$BUILD_MODE; then
              exit 0
            fi
            echo "Retry $RETRY..."
            rm -rf build .dart_tool pubspec.lock
            # Auto fix sederhana: turunkan sdk constraint jika error
            sed -i -E "s/sdk:[[:space:]]*['\"]?[\^>=]*3\.[0-9]+(\.[0-9]+)?['\"]?/sdk: \">=3.6.0 <4.0.0\"/g" pubspec.yaml || true
          done
          exit 1

      - name: Sign Flutter APK
        if: env.type == 'flutter' && env.build_type == 'release'
        run: |
          APK=$(find flutter-project/build/app/outputs/flutter-apk -name "*.apk" | head -n1)
          if [ -f "$APK" ]; then
            $ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -n1)/apksigner sign --ks release.keystore --ks-pass pass:password --key-pass pass:password "$APK"
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app
          path: |
            project/app/build/outputs/apk/release/*.apk
            flutter-project/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
