plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.flutter_app'
    compileSdk 34
    defaultConfig {
        applicationId "com.example.flutter_app"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

flutter {
    source '../..'
}
