name: my_clean_app
description: "Aplikasi Flutter yang bersih, modern, dan legal."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  provider: ^6.1.2
  
  # Networking
  http: ^1.2.1
  
  # Storage & Files
  shared_preferences: ^2.2.3
  path_provider: ^2.1.3
  
  # UI Components
  cupertino_icons: ^1.0.8
  font_awesome_flutter: ^10.7.0
  shimmer: ^3.0.0
  cached_network_image: ^3.3.1
  carousel_slider: ^4.2.1
  
  # Media & Video
  video_player: ^2.8.6
  chewie: ^1.8.5
  audioplayers: ^6.0.0
  
  # Device Info
  device_info_plus: ^10.1.0
  network_info_plus: ^5.0.1
  permission_handler: ^11.3.1
  
  # Image & Files
  image_picker: ^1.1.2
  file_selector: ^1.0.3
  cross_file: ^0.3.4
  
  # Utilities
  intl: ^0.19.0
  url_launcher: ^6.3.0
  share_plus: ^12.0.1
  web_socket_channel: ^2.4.5
  socket_io_client: ^2.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/videos/
    - assets/icon/
  
  fonts:
    - family: Rajdhani
      fonts:
        - asset: fonts/Rajdhani-Regular.ttf
        - asset: fonts/Rajdhani-Bold.ttf
          weight: 700
    - family: Orbitron
      fonts:
        - asset: fonts/Orbitron-Regular.ttf
        - asset: fonts/Orbitron-Bold.ttf
          weight: 700
    - family: ShareTechMono
      fonts:
        - asset: fonts/ShareTechMono-Regular.ttf
